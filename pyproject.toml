[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-smoke"
version = "0.1.0"
description = "Parallel29 quote smoke-test bot"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "playwright==1.58.0",
]

[project.scripts]
parallel-smoke = "parallel_smoke.cli:parallel_smoke_main"
fuck = "parallel_smoke.cli:fuck_main"

[tool.setuptools]
packages = ["parallel_smoke"]
py-modules = ["quote_smoke_bot"]
