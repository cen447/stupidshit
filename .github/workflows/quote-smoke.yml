name: Quote Smoke Test

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of submissions"
        required: false
        default: "10"
      concurrency:
        description: "Parallel workers"
        required: false
        default: "3"
      progress_every:
        description: "Progress print interval"
        required: false
        default: "10"
      run_retries:
        description: "Retries per run"
        required: false
        default: "2"
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNS: ${{ github.event.inputs.runs || '3' }}
      CONCURRENCY: ${{ github.event.inputs.concurrency || '1' }}
      PROGRESS_EVERY: ${{ github.event.inputs.progress_every || '1' }}
      RUN_RETRIES: ${{ github.event.inputs.run_retries || '2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run quote smoke bot
        run: |
          python quote_smoke_bot.py \
            --runs "$RUNS" \
            --concurrency "$CONCURRENCY" \
            --progress-every "$PROGRESS_EVERY" \
            --run-retries "$RUN_RETRIES" \
            --skip-on-checkpoint \
            --checkpoint-grace-ms 15000

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-smoke-failures
          path: quote-smoke-failure*.png
          if-no-files-found: ignore
