name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute version
        shell: bash
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Using APP_VERSION=$VERSION"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build CLI binaries
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onefile --name parallel-smoke --collect-all playwright installers/entrypoints/parallel_smoke_entry.py
          pyinstaller --clean --noconfirm --onefile --name fuck --collect-all playwright installers/entrypoints/fuck_entry.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        run: iscc /DAppVersion=${{ env.APP_VERSION }} installers/windows/parallel-smoke.iss

      - name: Create stable latest Windows filename
        shell: bash
        run: |
          cp "dist-installer/parallel-smoke-${APP_VERSION}-windows-setup.exe" \
             "dist-installer/parallel-smoke-latest-windows-setup.exe"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: parallel-smoke-windows-installer
          path: dist-installer/*.exe

  build-macos-installer:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute version
        shell: bash
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Using APP_VERSION=$VERSION"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build CLI binaries
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onefile --name parallel-smoke --collect-all playwright installers/entrypoints/parallel_smoke_entry.py
          pyinstaller --clean --noconfirm --onefile --name fuck --collect-all playwright installers/entrypoints/fuck_entry.py

      - name: Build macOS pkg installer
        shell: bash
        run: |
          rm -rf pkgroot dist-installer
          mkdir -p pkgroot/usr/local/bin dist-installer
          cp dist/parallel-smoke pkgroot/usr/local/bin/parallel-smoke
          cp dist/fuck pkgroot/usr/local/bin/fuck
          chmod +x pkgroot/usr/local/bin/parallel-smoke pkgroot/usr/local/bin/fuck
          pkgbuild \
            --root pkgroot \
            --identifier com.cen447.parallel-smoke \
            --version "${APP_VERSION}" \
            --install-location / \
            "dist-installer/parallel-smoke-${APP_VERSION}-macos.pkg"

      - name: Create stable latest macOS filename
        shell: bash
        run: |
          cp "dist-installer/parallel-smoke-${APP_VERSION}-macos.pkg" \
             "dist-installer/parallel-smoke-latest-macos.pkg"

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: parallel-smoke-macos-installer
          path: dist-installer/*.pkg

  publish-release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build-windows-installer
      - build-macos-installer
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: parallel-smoke-windows-installer
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: parallel-smoke-macos-installer
          path: release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
