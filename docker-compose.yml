services:
  whatsapp-smoke:
    build: .
    container_name: whatsapp-smoke
    ports:
      - "8000:8000"
    environment:
      MAX_RUNS: "100"
      MAX_CONCURRENCY: "10"
      MAX_ACTIVE_JOBS: "1"
      QUOTE_BOT_PATH: "quote_smoke_bot.py"
      RUNS_DIR: "runs"
      WEBHOOK_SERVICE_TOKEN: ""
      WHATSAPP_ALLOWED_SENDERS: ""
      SMOKE_BYPASS_HEADER_NAME: "x-smoke-test-key"
      SMOKE_BYPASS_HEADER_VALUE: ""
    volumes:
      - ./runs:/app/runs
    restart: unless-stopped
